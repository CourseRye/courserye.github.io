# 每次推送到 main 分支时自动构建并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      # 算出这次改动过的网址，部署完成后推给 IndexNow
      - run: node scripts/indexnow.js ${{ github.event.before }}
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: .generated/indexnow.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署完成后把改动过的网址推给 IndexNow（Bing、Yandex 等共享），失败不影响网站
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
        continue-on-error: true
      - run: |
          if [ -f indexnow.json ]; then
            curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @indexnow.json https://api.indexnow.org/indexnow
          else
            echo "没有需要推送的网址"
          fi
